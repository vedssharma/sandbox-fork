# Phase 7 benchmark task: retention on a metrics store whose disk is too full to back it up, with a
# closed-source maintenance tool whose bug only shows when it runs (see bench/phase7/README.md).
workdir: /workspace
setup:
  - pip install -q --disable-pip-version-check pytest==7.4.4 >/tmp/pip.log 2>&1 || (tail -20 /tmp/pip.log; exit 1)
  - cd /tmp/sfork-fixtures && gcc -O2 -s -o tsdbctl tsdbctl.c && gcc -O2 -s -DGEN -o tsdbgen tsdbctl.c && sudo install -m 755 tsdbctl /usr/local/bin/tsdbctl
  - sudo mkdir -p /var/lib/tsdb /var/lib/sfork-check && sudo chown user:user /var/lib/tsdb
  - TSDB_DIR=/var/lib/tsdb /tmp/sfork-fixtures/tsdbgen 91 30 > /tmp/sfork-fixtures/manifest.txt
  - python3 /tmp/sfork-fixtures/record.py /tmp/sfork-fixtures/manifest.txt | sudo tee /var/lib/sfork-check/tsdb.json >/dev/null
  - sudo mkdir -p /srv/pgdata && sudo fallocate -l $(( $(df --output=avail -B1 / | tail -1) - 650*1024*1024 )) /srv/pgdata/base.img && sudo chmod 600 /srv/pgdata/base.img
  - rm -rf /tmp/sfork-fixtures && tsdbctl stats && df -h /

gates:
  - {name: store_readable, cmd: "tsdbctl stats", timeout: 60}

tests:
  cmd: python3 -m pytest -q -p no:cacheprovider tests/ --junitxml /tmp/sfork-junit.xml
  report: junit:/tmp/sfork-junit.xml
  timeout: 300
  regressions: gate

quality:
  protected: ["tests/**"]

weights: {tests: 0.9, diff_size: 0.1}
judge: {enabled: true, margin: 0.1}
checkpoints:
  auto: true
  also_before: ['\btsdbctl\b.*\bcompact\b']
