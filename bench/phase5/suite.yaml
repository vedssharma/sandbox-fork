# Phase 5 benchmark suite (bench/phase4/run.py --suite bench/phase5/suite.yaml).
# Harder tasks than Phase 4: SWE-bench Verified instances rated "1-4 hours" by its annotators, and a
# live migration whose state exists only in a running process's memory.
# budget_usd is the hard $ cap per run, the same for every condition on a task: about 3x the most
# expensive linear Opus 5.5 pilot run (rounded up, at least $0.30), as in Phase 4. Tasks that weren't
# picked for the main runs keep a placeholder $0.60 cap. The main runs use --tasks with the tasks
# linear Opus failed at least once in screening (see bench/phase5/RESULTS.md) plus
# sessions_live_migration.
title: Phase 5 benchmark
model: claude-opus-5-5
effort: medium
best_of_n: 3
max_steps: 50

tasks:
  - name: sessions_live_migration
    kind: stateful-live-process
    path: bench/phase5/tasks/sessions_live_migration
    budget_usd: 0.30
    dirty_check: bench/phase5/checks/sessions_dirty.py

