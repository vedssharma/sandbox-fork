[project]
name = "sandbox-fork"
version = "0.1.0"
description = "Fork-on-action and speculative exploration for coding agents, on E2B, Morph Cloud, Tensorlake or Daytona sandboxes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6",
    "daytona>=0.202.0",
    "e2b>=2.63",
    "morphcloud>=0.1.116",
    "pyyaml>=6",
    "tensorlake>=0.5.162",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sfork = "sfork.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sfork"]

[tool.ruff]
line-length = 110
target-version = "py312"
# task prompts quote GitHub issues verbatim, code blocks included
extend-exclude = ["bench/*/tasks/*/task.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# `timeout` params are forwarded to the remote sandbox, not local cancellation.
ignore = ["ASYNC109"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Benchmark task fixtures and generated shell commands: long literal lines read better unwrapped.
"bench/phase4/**" = ["E501"]
